services:
  libation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LIBATION_VERSION: "13.4.9"
    image: libation-web:latest
    container_name: libation
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./config:/config
      - libation-search:/config/SearchEngine
      - ./audiobooks:/audiobooks
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - SECRET_KEY=change-me-use-a-long-random-string
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=60
      - PUID=1000
      - PGID=1000
      # Container timezone. Without it everything is logged in UTC with nothing saying so.
      # Any tz database name works, e.g. America/Chicago, Europe/London, Australia/Sydney.
      - TZ=${TZ:-Etc/UTC}
    restart: unless-stopped

volumes:
  libation-search:
